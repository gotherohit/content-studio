# Cut a release by pushing a tag:  git tag v0.2.0 && git push origin v0.2.0
# The installer is built here and attached to the GitHub release, which is where
# the app looks when it checks for updates.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: |
          npm ci
          npm --prefix client ci

      - name: Test beat behaviour
        run: npm test

      - name: Build the client
        run: npm run build

      # The release is created first, and published, so electron-builder uploads into a
      # release that already exists. Left to itself it creates drafts — one per parallel
      # upload — which are invisible on the Releases page and unreadable by the updater.
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if (-not $?) {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --title $tag --generate-notes
          }

      - name: Build and publish the installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --publish always
